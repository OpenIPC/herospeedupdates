name: weekly-update

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      max_per_run:
        description: 'Max builds to download in this run'
        required: false
        default: '100'
      dry_run:
        description: 'Dry run (list, no download/upload)'
        required: false
        default: 'false'

concurrency:
  group: herospeedupdates-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Refresh the firmware list
        run: python refresh.py
      - name: Commit the list if changed
        if: always()
        run: |
          git config user.name  "herospeedupdates-bot"
          git config user.email "actions@github.com"
          git add items.json
          if git diff --cached --quiet; then
            echo "List unchanged."
          else
            git commit -m "chore: refresh firmware list $(date -u +%F)"
            git push
          fi

  download:
    # Reads the list committed on main; a failed refresh must not stop the
    # archive of what is already listed.
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name  "herospeedupdates-bot"
          git config user.email "actions@github.com"
      - name: Download new builds
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '100' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          args=(--max-per-run "$MAX_PER_RUN")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python download_firmwares.py "${args[@]}"
      - name: Push tail commits
        run: git push || true

  push-openipc-org:
    # openipc.org takes this token from weekly-update.yml on main alone, and
    # only once it knows this source: the repository variable PUSH_OPENIPC_ORG
    # is set to "true" when it does, and the push is skipped, not failed,
    # until then.
    needs: download
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.PUSH_OPENIPC_ORG == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python push_openipc_org.py
